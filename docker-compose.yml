services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: checkdee
      POSTGRES_PASSWORD: checkdee
      POSTGRES_DB: checkdee
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkdee"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      APP_ENV: development
      DATABASE_URL: postgres://checkdee:checkdee@postgres:5432/checkdee?sslmode=disable
      APP_DATABASE_URL: postgres://checkdee_app:checkdee-app-dev-only-change-me@postgres:5432/checkdee?sslmode=disable
      JWT_SECRET: dev-only-secret-change-me-min-32-bytes-long
      QR_SIGNING_SECRET: dev-only-qr-secret-change-me-min-32-bytes
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
