openapi: 3.0.3
info:
  title: Checkdee API
  description: >
    Employee attendance API for Checkdee โดย turnPRO.
    This spec is the shared contract between the Go backend and the
    generated frontend client — see design.md and CONTRIBUTING.md for
    project-wide conventions.
  version: 0.1.0

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/line/authorize:
    get:
      operationId: lineAuthorize
      summary: >
        Begin a LINE login. Mints a CSRF state and an id_token nonce, binds
        them to short-lived httpOnly cookies, and returns the LINE
        authorization URL to redirect the user to. The state is echoed back as
        a query parameter on the callback and must be sent to /auth/line/login.
      parameters:
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authorization URL issued (sets state and nonce cookies)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineAuthorizeResponse"
        "400":
          description: Missing redirect_uri

  /auth/line/login:
    post:
      operationId: lineLogin
      summary: Exchange a LINE Login authorization code for a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineLoginRequest"
      responses:
        "200":
          description: >
            Login succeeded. Sets an httpOnly refresh-token cookie
            (scoped to /auth) in addition to the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: LINE code/profile exchange failed
        "403":
          description: Account is deactivated

  /auth/login:
    post:
      operationId: passwordLogin
      summary: >
        Username/password login for the system_owner role — the only
        role that doesn't use LINE login. Accounts are bootstrapped
        out-of-band (see backend/cmd/seedowner), there is no signup
        endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
      responses:
        "200":
          description: >
            Login succeeded. Sets an httpOnly refresh-token cookie
            (scoped to /auth) in addition to the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Missing username or password
        "401":
          description: Invalid username or password
        "403":
          description: Account is deactivated

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotate the refresh-token cookie for a new access token
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_at]
                properties:
                  access_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        "401":
          description: Missing, invalid, or expired refresh token

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current refresh token server-side
      responses:
        "204":
          description: Logged out

  /auth/register:
    post:
      operationId: completeRegistration
      summary: Complete first-time onboarding for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRegistrationRequest"
      responses:
        "200":
          description: Registration completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Missing required fields
        "401":
          description: Missing or invalid access token

  /auth/me:
    get:
      operationId: getMe
      summary: Get the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing or invalid access token

  /schedules/me:
    get:
      operationId: getMySchedule
      summary: Get the authenticated employee's own recurring weekly schedule
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The employee's schedule rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkSchedule"
        "401":
          description: Missing or invalid access token

  /schedules/{employeeId}:
    get:
      operationId: getEmployeeSchedule
      summary: Admin view of one employee's schedule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: The employee's schedule rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkSchedule"
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner
    put:
      operationId: replaceEmployeeSchedule
      summary: >
        Replace an employee's whole schedule. Both the single-employee editor
        and CSV bulk import reduce to this one call — CSV import calls it once
        per employee found in the file.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceScheduleRequest"
      responses:
        "200":
          description: The employee's new schedule rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkSchedule"
        "400":
          description: >
            Invalid row data, or the new set would overlap (same employee +
            day of week + effective date range).
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner

  /holidays:
    get:
      operationId: listHolidays
      summary: List holidays in a date range. Readable by any authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Holidays in range, ordered by date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Holiday"
        "400":
          description: Missing or invalid from/to
        "401":
          description: Missing or invalid access token
    post:
      operationId: createHoliday
      summary: Add a manually-entered holiday
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHolidayRequest"
      responses:
        "201":
          description: Holiday created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holiday"
        "400":
          description: Missing required fields or invalid date
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner

  /holidays/{id}:
    put:
      operationId: updateHoliday
      summary: >
        Edit a holiday's name/local_name. Never changes source — editing a
        nager_date row does not flip it to manual.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HolidayId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHolidayRequest"
      responses:
        "200":
          description: Holiday updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holiday"
        "400":
          description: Missing required fields
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner
        "404":
          description: Holiday not found
    delete:
      operationId: deleteHoliday
      summary: >
        Delete a holiday. A real delete — holidays aren't subject to the
        soft-delete-only rule that applies to users.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HolidayId"
      responses:
        "204":
          description: Holiday deleted
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner

components:
  parameters:
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: string
    HolidayId:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    LineAuthorizeResponse:
      type: object
      required: [authorize_url]
      properties:
        authorize_url:
          type: string

    LineLoginRequest:
      type: object
      required: [code, redirect_uri, state]
      properties:
        code:
          type: string
        redirect_uri:
          type: string
        state:
          type: string
          description: Must equal the state returned by /auth/line/authorize.

    PasswordLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    CompleteRegistrationRequest:
      type: object
      required: [first_name, last_name, student_gen]
      properties:
        first_name:
          type: string
        last_name:
          type: string
        student_gen:
          type: string

    User:
      type: object
      required: [id, role, is_registered]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [system_owner, admin, supervisor, employee]
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        display_name:
          type: string
          nullable: true
        picture_url:
          type: string
          nullable: true
        is_registered:
          type: boolean

    AuthResponse:
      type: object
      required: [access_token, expires_at, user]
      properties:
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    WorkSchedule:
      type: object
      required: [id, employee_id, day_of_week, start_time, end_time, effective_from]
      properties:
        id:
          type: string
        employee_id:
          type: string
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Sunday
        start_time:
          type: string
          example: "09:00:00"
        end_time:
          type: string
          example: "17:00:00"
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
          nullable: true

    ReplaceScheduleRow:
      type: object
      required: [day_of_week, start_time, end_time, effective_from]
      properties:
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
        start_time:
          type: string
          example: "09:00:00"
        end_time:
          type: string
          example: "17:00:00"
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
          nullable: true

    ReplaceScheduleRequest:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ReplaceScheduleRow"

    Holiday:
      type: object
      required: [id, date, name, source]
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        name:
          type: string
        local_name:
          type: string
          nullable: true
        source:
          type: string
          enum: [nager_date, manual]

    CreateHolidayRequest:
      type: object
      required: [date, name]
      properties:
        date:
          type: string
          format: date
        name:
          type: string
        local_name:
          type: string

    UpdateHolidayRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        local_name:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
