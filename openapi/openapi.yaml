openapi: 3.0.3
info:
  title: Checkdee API
  description: >
    Employee attendance API for Checkdee โดย turnPRO.
    This spec is the shared contract between the Go backend and the
    generated frontend client — see design.md and CONTRIBUTING.md for
    project-wide conventions.
  version: 0.1.0

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/line/authorize:
    get:
      operationId: lineAuthorize
      summary: >
        Begin a LINE login. Mints a CSRF state and an id_token nonce, binds
        them to short-lived httpOnly cookies, and returns the LINE
        authorization URL to redirect the user to. The state is echoed back as
        a query parameter on the callback and must be sent to /auth/line/login.
      parameters:
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authorization URL issued (sets state and nonce cookies)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineAuthorizeResponse"
        "400":
          description: Missing redirect_uri

  /auth/line/login:
    post:
      operationId: lineLogin
      summary: Exchange a LINE Login authorization code for a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineLoginRequest"
      responses:
        "200":
          description: >
            Login succeeded. Sets an httpOnly refresh-token cookie
            (scoped to /auth) in addition to the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: LINE code/profile exchange failed
        "403":
          description: Account is deactivated

  /auth/login:
    post:
      operationId: passwordLogin
      summary: >
        Username/password login for the system_owner role — the only
        role that doesn't use LINE login. Accounts are bootstrapped
        out-of-band (see backend/cmd/seedowner), there is no signup
        endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
      responses:
        "200":
          description: >
            Login succeeded. Sets an httpOnly refresh-token cookie
            (scoped to /auth) in addition to the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Missing username or password
        "401":
          description: Invalid username or password
        "403":
          description: Account is deactivated

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotate the refresh-token cookie for a new access token
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_at]
                properties:
                  access_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        "401":
          description: Missing, invalid, or expired refresh token

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current refresh token server-side
      responses:
        "204":
          description: Logged out

  /auth/register:
    post:
      operationId: completeRegistration
      summary: Complete first-time onboarding for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRegistrationRequest"
      responses:
        "200":
          description: Registration completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Missing required fields
        "401":
          description: Missing or invalid access token

  /auth/me:
    get:
      operationId: getMe
      summary: Get the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing or invalid access token

  /schedules/me:
    get:
      operationId: getMySchedule
      summary: Get the authenticated employee's own recurring weekly schedule
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The employee's schedule rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkSchedule"
        "401":
          description: Missing or invalid access token

  /schedules/{employeeId}:
    get:
      operationId: getEmployeeSchedule
      summary: Admin view of one employee's schedule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: The employee's schedule rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkSchedule"
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner
    put:
      operationId: replaceEmployeeSchedule
      summary: >
        Replace an employee's whole schedule. Both the single-employee editor
        and CSV bulk import reduce to this one call — CSV import calls it once
        per employee found in the file.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceScheduleRequest"
      responses:
        "200":
          description: The employee's new schedule rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkSchedule"
        "400":
          description: >
            Invalid row data, or the new set would overlap (same employee +
            day of week + effective date range).
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner

  /holidays:
    get:
      operationId: listHolidays
      summary: List holidays in a date range. Readable by any authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Holidays in range, ordered by date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Holiday"
        "400":
          description: Missing or invalid from/to
        "401":
          description: Missing or invalid access token
    post:
      operationId: createHoliday
      summary: Add a manually-entered holiday
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHolidayRequest"
      responses:
        "201":
          description: Holiday created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holiday"
        "400":
          description: Missing required fields or invalid date
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner

  /holidays/{id}:
    put:
      operationId: updateHoliday
      summary: >
        Edit a holiday's name/local_name. Never changes source — editing a
        nager_date row does not flip it to manual.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HolidayId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHolidayRequest"
      responses:
        "200":
          description: Holiday updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holiday"
        "400":
          description: Missing required fields
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner
        "404":
          description: Holiday not found
    delete:
      operationId: deleteHoliday
      summary: >
        Delete a holiday. A real delete — holidays aren't subject to the
        soft-delete-only rule that applies to users.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HolidayId"
      responses:
        "204":
          description: Holiday deleted
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner

  /kiosk/devices:
    get:
      operationId: listKioskDevices
      summary: List active kiosk devices, tokens masked
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KioskDevice"
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner
    post:
      operationId: createKioskDevice
      summary: >
        Create a new kiosk device. The response includes the full token —
        the only two times that ever happens (here and rotate).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKioskDeviceRequest"
      responses:
        "201":
          description: Device created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskDeviceWithToken"
        "400":
          description: Missing required fields
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner

  /kiosk/devices/{deviceId}/rotate:
    post:
      operationId: rotateKioskDevice
      summary: Issue a new token for an existing device, invalidating the old one immediately
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: New token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskDeviceWithToken"
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner
        "404":
          description: Device not found

  /kiosk/devices/{deviceId}/revoke:
    post:
      operationId: revokeKioskDevice
      summary: Kill a device's live session immediately and permanently
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Device revoked
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner
        "404":
          description: Device not found

  /kiosk/qr-token:
    get:
      operationId: getKioskQRToken
      summary: >
        Mint the next rotating QR payload for this screen. Device-token
        authenticated (query param, not a user bearer token) — the kiosk TV
        polls this roughly every 15s.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A freshly signed QR payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QRTokenResponse"
        "401":
          description: Missing, invalid, or revoked device token

  /attendance/check-in:
    post:
      operationId: checkIn
      summary: >
        Verify a scanned QR payload (signature, expiry, single-use) and
        record the check-in, computing the no-grace-period late/absent
        status against the employee's schedule for today.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInRequest"
      responses:
        "200":
          description: Check-in recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
        "400":
          description: Missing qr_token or idempotency_key
        "401":
          description: Missing/invalid access token, or the qr_token is invalid/expired/device inactive
        "409":
          description: QR code already used, or already checked in today

  /attendance/check-out:
    post:
      operationId: checkOut
      summary: >
        Plain in-app checkout — no QR, no camera step, per the flow update
        that replaced the original checkout design.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckOutRequest"
      responses:
        "200":
          description: Check-out recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
        "400":
          description: Missing idempotency_key
        "401":
          description: Missing or invalid access token
        "409":
          description: Not checked in today, or already checked out today

  /reports/monthly:
    get:
      operationId: getMonthlyReport
      summary: Org-wide monthly attendance summary — one row per active employee
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Month"
      responses:
        "200":
          description: Monthly report rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyReportRow"
        "400":
          description: Missing or invalid month
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner

  /reports/daily-log:
    get:
      operationId: getDailyLog
      summary: >
        Daily attendance log for a month, org-wide or scoped to one employee
        via employee_id — backs the calendar-heatmap / daily detail view.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Month"
        - name: employee_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Daily log rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyLogRow"
        "400":
          description: Missing or invalid month
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner

  /reports/export:
    post:
      operationId: requestReportExport
      summary: >
        Enqueue an async Excel export for a month — processing then
        download-link state, no export history (v1).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestExportRequest"
      responses:
        "202":
          description: Export enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportExport"
        "400":
          description: Missing month
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner

  /reports/export/{id}:
    get:
      operationId: getReportExport
      summary: Poll export status
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "200":
          description: Current export status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportExport"
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner
        "404":
          description: Export not found

  /reports/export/{id}/download:
    get:
      operationId: downloadReportExport
      summary: Download the finished .xlsx file
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "200":
          description: The .xlsx file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner
        "404":
          description: Export not found
        "409":
          description: Export is not ready yet

  /leave-requests:
    post:
      operationId: createLeaveRequest
      summary: >
        Submit a leave request for the authenticated employee. In-app
        approval only — the employee sends a formal-Thai letter manually
        (see lib/leave-email.ts on the frontend), no server-generated email
        approval link.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeaveRequestRequest"
      responses:
        "201":
          description: Leave request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          description: Invalid dates, or end_date before start_date
        "401":
          description: Missing or invalid access token
    get:
      operationId: listLeaveRequests
      summary: Admin org-wide view, pending requests sorted first
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Leave requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveRequest"
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner

  /leave-requests/me:
    get:
      operationId: getMyLeaveRequests
      summary: The authenticated employee's own leave requests
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Leave requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveRequest"
        "401":
          description: Missing or invalid access token

  /leave-requests/{id}/approve:
    post:
      operationId: approveLeaveRequest
      summary: Approve a pending leave request. A decision cannot be changed once made.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LeaveRequestId"
      responses:
        "200":
          description: Leave request approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner
        "404":
          description: Leave request not found
        "409":
          description: Leave request already decided

  /leave-requests/{id}/reject:
    post:
      operationId: rejectLeaveRequest
      summary: Reject a pending leave request. A decision cannot be changed once made.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LeaveRequestId"
      responses:
        "200":
          description: Leave request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner
        "404":
          description: Leave request not found
        "409":
          description: Leave request already decided

  /notifications/me:
    get:
      operationId: getMyNotifications
      summary: >
        The authenticated user's own notifications, most recent first.
        In-app feed only — there is no email/SMS/LINE-push channel yet (the
        original spec's "leave-link expiry/escalation" scope assumed the
        email-approval flow PR 8 decided against).
      security:
        - bearerAuth: []
      parameters:
        - name: unread
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "401":
          description: Missing or invalid access token

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      summary: Mark one of the authenticated user's own notifications read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "204":
          description: Marked read
        "401":
          description: Missing or invalid access token
        "404":
          description: Notification not found (or belongs to another user)

  /employees:
    get:
      operationId: listEmployees
      summary: >
        The employee directory, filterable and paginated. Distinct from
        /reports' internal ListActiveEmployees (role-locked to "employee",
        unfiltered) — this backs the admin UI's employee list, roster, and
        employee-picker dropdowns.
      security:
        - bearerAuth: []
      parameters:
        - name: team_id
          in: query
          required: false
          schema:
            type: string
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [admin, supervisor, employee]
        - name: status
          in: query
          required: false
          description: >
            Filters on offboarded_at, not the separate active/inactive
            status column.
          schema:
            type: string
            enum: [active, offboarded]
        - name: search
          in: query
          required: false
          description: Matched against first_name, last_name, and line_display_name.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Matching employees and the total count before pagination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeListResponse"
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner

  /employees/{id}:
    get:
      operationId: getEmployee
      summary: Get one employee
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EmployeeUserId"
      responses:
        "200":
          description: The employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner
        "404":
          description: Employee not found
    patch:
      operationId: updateEmployee
      summary: >
        Edit profile fields only (first_name, last_name, team_id). Role and
        offboarding go through their own endpoints below — distinct, more
        sensitive actions with their own audit-log entries.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EmployeeUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
      responses:
        "200":
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Missing first_name or last_name
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner
        "404":
          description: Employee not found

  /employees/{id}/role:
    patch:
      operationId: updateEmployeeRole
      summary: >
        Change an employee's role. Rejects any transition to or from
        system_owner — that account is bootstrapped out-of-band via
        cmd/seedowner only, never promoted/demoted through this API.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EmployeeUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRoleRequest"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Missing role
        "401":
          description: Missing or invalid access token
        "403":
          description: >
            Caller is not admin/supervisor/system_owner, or the requested
            change would move the role to or from system_owner
        "404":
          description: Employee not found

  /employees/{id}/offboard:
    post:
      operationId: offboardEmployee
      summary: >
        Soft-delete an employee (offboarded_at/by/reason) — users are never
        hard-deleted, see design.md. Rejects an already-offboarded target
        and a system_owner target.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EmployeeUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OffboardEmployeeRequest"
      responses:
        "200":
          description: Employee offboarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "401":
          description: Missing or invalid access token
        "403":
          description: Caller is not admin/supervisor/system_owner, or target is system_owner
        "404":
          description: Employee not found
        "409":
          description: Employee already offboarded

components:
  parameters:
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: string
    HolidayId:
      name: id
      in: path
      required: true
      schema:
        type: string
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
    Month:
      name: month
      in: query
      required: true
      schema:
        type: string
        pattern: "^\\d{4}-\\d{2}$"
        example: "2026-03"
    ExportId:
      name: id
      in: path
      required: true
      schema:
        type: string
    LeaveRequestId:
      name: id
      in: path
      required: true
      schema:
        type: string
    NotificationId:
      name: id
      in: path
      required: true
      schema:
        type: string
    EmployeeUserId:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    LineAuthorizeResponse:
      type: object
      required: [authorize_url]
      properties:
        authorize_url:
          type: string

    LineLoginRequest:
      type: object
      required: [code, redirect_uri, state]
      properties:
        code:
          type: string
        redirect_uri:
          type: string
        state:
          type: string
          description: Must equal the state returned by /auth/line/authorize.

    PasswordLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    CompleteRegistrationRequest:
      type: object
      required: [first_name, last_name, student_gen]
      properties:
        first_name:
          type: string
        last_name:
          type: string
        student_gen:
          type: string

    User:
      type: object
      required: [id, role, is_registered]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [system_owner, admin, supervisor, employee]
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        display_name:
          type: string
          nullable: true
        picture_url:
          type: string
          nullable: true
        is_registered:
          type: boolean

    AuthResponse:
      type: object
      required: [access_token, expires_at, user]
      properties:
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    WorkSchedule:
      type: object
      required: [id, employee_id, day_of_week, start_time, end_time, effective_from]
      properties:
        id:
          type: string
        employee_id:
          type: string
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Sunday
        start_time:
          type: string
          example: "09:00:00"
        end_time:
          type: string
          example: "17:00:00"
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
          nullable: true

    ReplaceScheduleRow:
      type: object
      required: [day_of_week, start_time, end_time, effective_from]
      properties:
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
        start_time:
          type: string
          example: "09:00:00"
        end_time:
          type: string
          example: "17:00:00"
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
          nullable: true

    ReplaceScheduleRequest:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ReplaceScheduleRow"

    Holiday:
      type: object
      required: [id, date, name, source]
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        name:
          type: string
        local_name:
          type: string
          nullable: true
        source:
          type: string
          enum: [nager_date, manual]

    CreateHolidayRequest:
      type: object
      required: [date, name]
      properties:
        date:
          type: string
          format: date
        name:
          type: string
        local_name:
          type: string

    UpdateHolidayRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        local_name:
          type: string

    KioskDevice:
      type: object
      required: [id, device_id, name, masked_token]
      properties:
        id:
          type: string
        device_id:
          type: string
        name:
          type: string
        masked_token:
          type: string
          example: "••••••••ab12"
        created_by:
          type: string
          nullable: true

    KioskDeviceWithToken:
      allOf:
        - $ref: "#/components/schemas/KioskDevice"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The full raw device token. Only ever returned here and from rotate.

    CreateKioskDeviceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    QRTokenResponse:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time

    CheckInRequest:
      type: object
      required: [qr_token, idempotency_key]
      properties:
        qr_token:
          type: string
        idempotency_key:
          type: string
          description: Client-generated, stable across retries of the same logical attempt.

    CheckOutRequest:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key:
          type: string

    AttendanceRecord:
      type: object
      required: [id, employee_id, work_date, status, auto_closed]
      properties:
        id:
          type: string
        employee_id:
          type: string
        work_date:
          type: string
          format: date
        check_in_at:
          type: string
          nullable: true
          example: "09:03:00"
        check_out_at:
          type: string
          nullable: true
          example: "17:05:00"
        status:
          type: string
          enum: [pending, present, late, absent]
        auto_closed:
          type: boolean

    MonthlyReportRow:
      type: object
      required: [employee_id, work_days, late_count, late_minutes, absent_count, leave_days, worked_hours]
      properties:
        employee_id:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        work_days:
          type: integer
        late_count:
          type: integer
        late_minutes:
          type: integer
        absent_count:
          type: integer
        leave_days:
          type: integer
        worked_hours:
          type: number
          description: >
            Capped to each day's scheduled shift length — never counts time
            outside the scheduled window, even with a real late checkout.

    DailyLogRow:
      type: object
      required: [date, employee_id, status, auto_closed]
      properties:
        date:
          type: string
          format: date
        employee_id:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, present, late, absent]
        check_in_at:
          type: string
          nullable: true
        check_out_at:
          type: string
          nullable: true
        auto_closed:
          type: boolean

    RequestExportRequest:
      type: object
      required: [month]
      properties:
        month:
          type: string
          pattern: "^\\d{4}-\\d{2}$"

    ReportExport:
      type: object
      required: [id, month, status]
      properties:
        id:
          type: string
        month:
          type: string
        status:
          type: string
          enum: [processing, ready, failed]
        error:
          type: string
          nullable: true

    CreateLeaveRequestRequest:
      type: object
      required: [start_date, end_date]
      properties:
        leave_type:
          type: string
          description: Free-text leave category (ประเภทการลา), distinct from reason.
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        reason:
          type: string

    LeaveRequest:
      type: object
      required: [id, employee_id, start_date, end_date, status, created_at]
      properties:
        id:
          type: string
        employee_id:
          type: string
        leave_type:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        reason:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, approved, rejected]
        decided_by:
          type: string
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Notification:
      type: object
      required: [id, type, title, created_at]
      properties:
        id:
          type: string
        type:
          type: string
          example: leave.decided
        title:
          type: string
        body:
          type: string
          nullable: true
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Employee:
      type: object
      required: [id, role, status, created_at]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [system_owner, admin, supervisor, employee]
        status:
          type: string
          enum: [active, inactive]
        team_id:
          type: string
          nullable: true
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        student_gen:
          type: string
          nullable: true
        line_display_name:
          type: string
          nullable: true
        line_picture_url:
          type: string
          nullable: true
        registration_completed_at:
          type: string
          format: date-time
          nullable: true
        offboarded_at:
          type: string
          format: date-time
          nullable: true
        offboarded_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    EmployeeListResponse:
      type: object
      required: [employees, total]
      properties:
        employees:
          type: array
          items:
            $ref: "#/components/schemas/Employee"
        total:
          type: integer
          description: Total matching rows before limit/offset pagination.

    UpdateEmployeeRequest:
      type: object
      required: [first_name, last_name]
      properties:
        first_name:
          type: string
        last_name:
          type: string
        team_id:
          type: string
          nullable: true

    UpdateEmployeeRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, supervisor, employee]
          description: system_owner is rejected — see the endpoint summary.

    OffboardEmployeeRequest:
      type: object
      properties:
        reason:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
